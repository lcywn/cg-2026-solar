<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6주차 task2</title>
  <link rel="stylesheet" href="demo.css">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    .wrap{display:grid;grid-template-columns:minmax(0,1fr) 15rem;height:100vh;height:100dvh}
    .stage{position:relative;display:block;min-width:0;min-height:320px;background:#05070c}
    .stage canvas{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;touch-action:none}
    .panel{box-sizing:border-box;overflow:auto;padding:20px 16px 180px;background:#fff;color:#202b3c}
    .panel h1{margin:0 0 12px;font-size:17px}
    .panel .sub{margin-bottom:24px;font-size:13px;line-height:1.6;color:#536176}
    .panel .ctl{margin-bottom:20px}
    .panel .ctl label{color:#202b3c;font-size:12px}
    .panel .ctl .val{color:#3478f6}
    .panel input[type="range"]{accent-color:#3478f6}
    #status{font-size:12px;line-height:1.5;color:#b4232a}
    @media(max-width:800px){
      html,body{height:auto;min-height:100%;overflow:auto}
      .wrap{display:block;height:auto;min-height:100vh}
      .stage{height:68vh;height:68dvh;min-height:360px}
      .panel{max-height:none;overflow:visible}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="stage">
      <canvas id="cv" aria-label="중앙 행성과 공전하는 작은 행성 및 별이 있는 장면" tabindex="0"></canvas>
    </main>
    <aside class="panel">
      <h1>6주차 task2</h1>
      <p class="sub">행성간 거리에 따른 화산과 얼음 변화</p>
      <div class="ctl">
        <label for="star-orbit">별에서의 거리 · 초코 범위 <output class="val" id="star-orbit-value" for="star-orbit">100</output></label>

       <input id="star-orbit" type="range" min="0" max="100" step="1" value="100">
      </div>
      <div class="ctl">
        <label for="moon-orbit">작은 행성에서의 거리 · 조석 가열 <output class="val" id="moon-orbit-value" for="moon-orbit">50</output></label>

        <input id="moon-orbit" type="range" min="0" max="100" step="1" value="50">
      </div>
      <div class="ctl">
        <label for="result-view">계산 결과 보기</label>
        <select id="result-view">
          <option value="pbr">PBR 재질</option>
          <option value="chocolate">초코 마스크</option>
          <option value="kataifi">카다이프 화산 마스크</option>
        </select>
      </div>
      <button class="btn" id="motion-toggle" type="button">모션 일시정지</button>
      <button class="btn" id="surface-toggle" type="button">기본 행성 보기</button>
      <button class="btn" id="camera-reset" type="button">시점 초기화</button>
      <p id="status" role="status" hidden></p>
    </aside>
  </div>
  <script src="demo.js"></script>
  <script src="task2.js"></script>
</body>
</html>
